<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>毛玻璃工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}

/* 搜索 */
.s{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:460px;max-width:90vw;z-index:1000;background:rgba(10,15,30,.45);backdrop-filter:blur(18px);border-radius:60px;border:1px solid rgba(255,255,255,.08);padding:6px 6px 6px 22px;display:flex;align-items:center}
.s input{flex:1;padding:14px 0;border:none;background:0 0;color:#f0f4ff;font-size:1rem;outline:none}
.s input::placeholder{color:rgba(200,215,255,.4)}
.s button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#c8d6f0;padding:8px 20px;border-radius:40px;cursor:pointer}
.s button:hover{background:rgba(0,200,255,.15);border-color:rgba(0,200,255,.3)}

/* 主窗口 */
#w{position:fixed;width:520px;background:rgba(10,15,30,.55);backdrop-filter:blur(16px);border-radius:24px;border:1px solid rgba(255,255,255,.08);top:60px;left:60px;overflow:hidden;z-index:999;user-select:none;max-height:90vh;display:flex;flex-direction:column}
#b{height:46px;background:rgba(255,255,255,.04);color:#d0e0ff;line-height:46px;padding:0 20px;cursor:grab;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
#b:active{cursor:grabbing}
#c{flex:1;overflow-y:auto;padding:16px 18px 20px;display:flex;gap:20px}
.l{flex:2}.r{flex:1;border-left:1px solid rgba(255,255,255,.05);padding-left:18px;display:flex;flex-direction:column;justify-content:center}

/* 图片拖拽 */
.u{display:block;width:100%;padding:16px 12px;margin-bottom:16px;text-align:center;background:rgba(255,255,255,.04);border:2px dashed rgba(255,255,255,.15);border-radius:16px;color:rgba(200,215,255,.5);font-size:.85rem;transition:.3s}
.u.drag{border-color:rgba(0,200,255,.6);background:rgba(0,200,255,.08);color:#c8d6f0}
.u span{display:block;font-size:1.8rem;margin-bottom:4px}

/* 日历 */
#cal{width:100%;max-width:280px;margin:0 auto;text-align:center}
#cal .hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1rem;color:#b6ceff;margin-bottom:12px}
#cal .hd button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);width:32px;height:32px;border-radius:30px;font-size:1.2rem;color:#a0c0ff;cursor:pointer}
#cal .hd button:hover{background:rgba(0,255,255,.12)}
#cal table{width:100%;border-collapse:collapse;table-layout:fixed}
#cal th{font-size:.65rem;color:rgba(180,200,255,.4);padding:6px 0;font-weight:400}
#cal td{padding:7px 0;font-size:.9rem;text-align:center;cursor:pointer;border-radius:30px;color:#c8d6f0}
#cal td:hover:not(.o){background:rgba(255,255,255,.06)}
#cal td.t{background:rgba(0,200,255,.15);color:#fff;font-weight:600}
#cal td.s{background:linear-gradient(135deg,#00d4ff,#a855f7);color:#fff;font-weight:600}
#cal td.o{color:rgba(255,255,255,.12);pointer-events:none}
#cal .inf{text-align:center;margin-top:14px;font-size:.75rem;color:rgba(180,200,255,.35);border-top:1px solid rgba(255,255,255,.04);padding-top:12px}

/* 计时器 */
.tm{display:flex;flex-direction:column;align-items:center;gap:12px}
.tm .dp{font-size:2.2rem;font-family:monospace;color:#f0f4ff;letter-spacing:3px;background:rgba(0,0,0,.2);padding:10px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.05);width:100%;text-align:center}
.tm .bg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tm .bg button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c8d6f0;padding:6px 16px;border-radius:30px;cursor:pointer;font-size:.85rem;transition:.15s}
.tm .bg button:hover{background:rgba(255,255,255,.12)}
.tm .bg .st{background:rgba(0,200,255,.15);border-color:rgba(0,200,255,.2)}
.tm .bg .st:hover{background:rgba(0,200,255,.25)}
.tm .bg .sp{background:rgba(255,100,100,.15);border-color:rgba(255,100,100,.2)}
.tm .bg .sp:hover{background:rgba(255,100,100,.25)}
.tm .bg .rs{background:rgba(255,200,50,.1);border-color:rgba(255,200,50,.15)}
.tm .bg .rs:hover{background:rgba(255,200,50,.2)}

/* 时钟 */
#cl{position:fixed;bottom:28px;right:28px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:#9effb0;padding:8px 20px;border-radius:40px;font:16px monospace;border:1px solid rgba(0,255,200,.08);z-index:999}

/* 骰子窗口（右下） */
#dw{position:fixed;width:240px;background:rgba(10,15,30,.55);backdrop-filter:blur(16px);border-radius:24px;border:1px solid rgba(255,255,255,.08);bottom:100px;right:60px;overflow:hidden;z-index:998;user-select:none;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#db{height:40px;background:rgba(255,255,255,.04);color:#d0e0ff;line-height:40px;padding:0 16px;cursor:grab;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem}
#db:active{cursor:grabbing}
#dc{padding:16px;text-align:center;color:#c8d6f0}
#dv{font-size:4rem;font-weight:300;margin:8px 0;transition:.1s}
#dv.roll{animation:sh .3s ease-in-out}
@keyframes sh{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.2) rotate(-10deg)}50%{transform:scale(1) rotate(10deg)}75%{transform:scale(1.1) rotate(-5deg)}100%{transform:scale(1) rotate(0deg)}}
#dbn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#c8d6f0;padding:8px 20px;border-radius:30px;cursor:pointer;font-size:1rem;transition:.15s}
#dbn:hover{background:rgba(0,200,255,.15);border-color:rgba(0,200,255,.3)}
#dh{margin-top:12px;font-size:.8rem;color:rgba(200,215,255,.5);display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#dh span{background:rgba(255,255,255,.05);padding:2px 8px;border-radius:12px}

/* 待办窗口（骰子左侧） */
#tw{position:fixed;width:280px;background:rgba(10,15,30,.55);backdrop-filter:blur(16px);border-radius:24px;border:1px solid rgba(255,255,255,.08);bottom:100px;right:320px; /* 骰子宽240 + 右边距60 + 间距20 */ overflow:hidden;z-index:998;user-select:none;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:320px;display:flex;flex-direction:column}
#tb{height:40px;background:rgba(255,255,255,.04);color:#d0e0ff;line-height:40px;padding:0 16px;cursor:grab;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);font-size:.9rem;flex-shrink:0}
#tb:active{cursor:grabbing}
#tc{padding:12px 16px 16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#tiw{display:flex;gap:6px}
#tiw input{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c8d6f0;padding:6px 10px;border-radius:20px;font-size:.85rem;outline:none}
#tiw input:focus{border-color:rgba(0,200,255,.3)}
#tiw button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#c8d6f0;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.8rem;transition:.15s}
#tiw button:hover{background:rgba(0,200,255,.15);border-color:rgba(0,200,255,.3)}
#tl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
#tl li{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);padding:4px 10px;border-radius:16px;color:#c8d6f0;font-size:.85rem;transition:.15s}
#tl li:hover{background:rgba(255,255,255,.08)}
#tl li .tx{flex:1;cursor:pointer;padding:4px 0;transition:.15s}
#tl li .tx.done{text-decoration:line-through;opacity:.5}
#tl li .dl{background:rgba(255,100,100,.1);border:none;color:#ff6b6b;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.8rem;display:flex;align-items:center;justify-content:center}
#tl li .dl:hover{background:rgba(255,100,100,.25)}
</style>
</head>
<body>
<form class="s" action="https://www.baidu.com/s" target="_blank" method="get">
  <input type="text" name="wd" placeholder="🔍 搜索...">
  <button>搜索</button>
</form>

<div id="w">
  <div id="b" onmousedown="dragStart(event,'w')"><span>✧ 工具箱</span><span>🪟</span></div>
  <div id="c">
    <div class="l">
      <div class="u" id="uz"><span>📁</span>拖拽图片<br><span style="font-size:.7rem;opacity:.6">新窗口打开</span></div>
      <div id="cal"></div>
    </div>
    <div class="r">
      <div class="tm">
        <div class="dp" id="tdp">00:00</div>
        <div class="bg">
          <button class="st" id="tst">▶ 开始</button>
          <button class="sp" id="tsp">⏸ 暂停</button>
          <button class="rs" id="trs">⟳ 重置</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="dw">
  <div id="db" onmousedown="dragStart(event,'dw')"><span>🎲 骰子</span><span style="opacity:.5;">🎯</span></div>
  <div id="dc">
    <div id="dv">⚀</div>
    <button id="dbn">掷骰子</button>
    <div id="dh"></div>
  </div>
</div>

<div id="tw">
  <div id="tb" onmousedown="dragStart(event,'tw')"><span>📋 待办</span><span style="opacity:.5;">✓</span></div>
  <div id="tc">
    <div id="tiw">
      <input type="text" id="tinput" placeholder="添加任务...">
      <button id="tadd">添加</button>
    </div>
    <ul id="tl"></ul>
  </div>
</div>

<div id="cl"></div>

<script>
// 通用拖拽
(function(){let w=null,ox,oy;window.dragStart=function(e,id){e.preventDefault();w=document.getElementById(id);ox=e.clientX-w.offsetLeft;oy=e.clientY-w.offsetTop;document.onmousemove=ev=>{ev.preventDefault();w.style.left=(ev.clientX-ox)+'px';w.style.top=(ev.clientY-oy)+'px'};document.onmouseup=()=>{document.onmousemove=null;document.onmouseup=null;w=null}}})();

// 日历
(function(){const c=document.getElementById('cal');let y,m,sel=null;function R(yy,mm){y=yy;m=mm;const fd=new Date(yy,mm,1).getDay(),dm=new Date(yy,mm+1,0).getDate(),pm=new Date(yy,mm,0).getDate();const t=new Date(),td=t.getDate(),tm=t.getMonth(),ty=t.getFullYear();let h=`<div class="hd"><button onclick="P()">‹</button><span>${yy}年 ${mm+1}月</span><button onclick="N()">›</button></div><table><thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead><tbody><tr>`;for(let i=0;i<fd;i++){const d=pm-fd+i+1;h+=`<td class="o">${d}</td>`;}for(let d=1;d<=dm;d++){const isT=d===td&&mm===tm&&yy===ty;const isS=sel&&d===sel.getDate()&&mm===sel.getMonth()&&yy===sel.getFullYear();const cl=(isT?' t':'')+(isS?' s':'');h+=`<td class="${cl}" onclick="Q(${yy},${mm},${d})">${d}</td>`;if((fd+d-1)%7===6&&d<dm)h+='</tr><tr>';}const rem=(7-(fd+dm)%7)%7;for(let i=1;i<=rem;i++)h+=`<td class="o">${i}</td>`;h+=`</tr></tbody></table><div class="inf">${sel?'已选：'+sel.getFullYear()+'/'+(sel.getMonth()+1)+'/'+sel.getDate():'点击日期选中'}</div>`;c.innerHTML=h;}window.P=()=>{if(m===0)R(y-1,11);else R(y,m-1);};window.N=()=>{if(m===11)R(y+1,0);else R(y,m+1);};window.Q=(yy,mm,dd)=>{sel=new Date(yy,mm,dd);R(y,m);};const n=new Date();R(n.getFullYear(),n.getMonth());})();

// 时钟
setInterval(()=>{document.getElementById('cl').textContent=new Date().toLocaleString('zh-CN',{hour12:false})},1000);
document.getElementById('cl').textContent=new Date().toLocaleString('zh-CN',{hour12:false});

// 图片拖拽
(function(){const uz=document.getElementById('uz');['dragenter','dragover','dragleave','drop'].forEach(evt=>document.addEventListener(evt,e=>{e.preventDefault();e.stopPropagation()}));uz.addEventListener('dragover',()=>uz.classList.add('drag'));uz.addEventListener('dragleave',()=>uz.classList.remove('drag'));uz.addEventListener('drop',function(e){this.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){const r=new FileReader();r.onload=ev=>{const w=window.open('','_blank','width=800,height=600,menubar=no,toolbar=no,location=no,status=no,scrollbars=yes');if(!w){alert('请允许弹窗');return;}w.document.write(`<!DOCTYPE html><html><head><title>图片</title><style>*{margin:0;padding:0}body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;min-height:100vh}img{max-width:95vw;max-height:95vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.8)}</style></head><body>< img src="${ev.target.result}"></body></html>`);w.document.close();};r.readAsDataURL(f);}else alert('请拖入图片文件');});})();

// 计时器
(function(){const dp=document.getElementById('tdp');let timer=null,sec=0;const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;};const upd=()=>{dp.textContent=fmt(sec);};const st=()=>{if(timer)return;timer=setInterval(()=>{sec++;upd();},1000);};const sp=()=>{clearInterval(timer);timer=null;};const rs=()=>{sp();sec=0;upd();};document.getElementById('tst').onclick=st;document.getElementById('tsp').onclick=sp;document.getElementById('trs').onclick=rs;upd();})();

// 骰子
(function(){const dv=document.getElementById('dv'),dh=document.getElementById('dh'),btn=document.getElementById('dbn');const faces=['⚀','⚁','⚂','⚃','⚄','⚅'],h=[];const roll=()=>{dv.classList.remove('roll');void dv.offsetWidth;dv.classList.add('roll');const r=Math.floor(Math.random()*6)+1;dv.textContent=faces[r-1];h.push(r);if(h.length>5)h.shift();dh.innerHTML=h.map(n=>`<span>${faces[n-1]}</span>`).join('');};btn.onclick=roll;dv.textContent=faces[0];})();

// 待办（localStorage）
(function(){const input=document.getElementById('tinput'),add=document.getElementById('tadd'),list=document.getElementById('tl');const KEY='todo_list_data';let todos=[];const load=()=>{try{const raw=localStorage.getItem(KEY);if(raw)todos=JSON.parse(raw);}catch(e){todos=[];}};const save=()=>{localStorage.setItem(KEY,JSON.stringify(todos));};const render=()=>{list.innerHTML='';if(!todos.length){list.innerHTML='<li style="justify-content:center;opacity:.4;font-size:.8rem;">暂无任务</li>';return;}todos.forEach((todo,idx)=>{const li=document.createElement('li');const tx=document.createElement('span');tx.className='tx'+(todo.done?' done':'');tx.textContent=todo.text;tx.onclick=()=>{todos[idx].done=!todos[idx].done;save();render();};const dl=document.createElement('button');dl.className='dl';dl.textContent='×';dl.onclick=e=>{e.stopPropagation();todos.splice(idx,1);save();render();};li.appendChild(tx);li.appendChild(dl);list.appendChild(li);});};const addTodo=()=>{const text=input.value.trim();if(!text){alert('请输入任务');return;}todos.push({id:Date.now(),text,done:false});save();render();input.value='';};load();render();add.onclick=addTodo;input.onkeydown=e=>{if(e.key==='Enter')addTodo();};})();
</script>
</body>
</html>
