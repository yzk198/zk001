<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可拖拽窗口 + 日历</title>

  <!-- ============================================================
       【模块1：可拖拽日历窗口 - 样式】
       功能：定义悬浮窗口的外观、位置、阴影效果，以及日历的整体样式
       包括：窗口容器、拖拽标题栏、内容区、日历表格、日期高亮等
       ============================================================ -->
  <style>
    /* 日历窗口容器 - 固定定位、圆角、阴影 */
    #win {
      position: fixed;
      width: 340px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      top: 60px;
      left: 60px;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      z-index: 999;
      user-select: none; /* 防止拖动时选中文字 */
    }
    /* 窗口标题栏 - 渐变背景、拖动手柄 */
    #bar {
      height: 44px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      line-height: 44px;
      padding: 0 20px;
      cursor: grab;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #bar:active {
      cursor: grabbing;
    }
    /* 窗口内容区域 */
    #content {
      padding: 20px 18px 24px;
      background: #fafafa;
      border-top: 1px solid #eee;
    }
    /* 日历容器 */
    #calendar {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      font-family: inherit;
      text-align: center;
    }
    /* 日历头部（年月 + 左右切换按钮） */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 10px;
    }
    .cal-header button {
      background: #eee;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cal-header button:hover {
      background: #ddd;
    }
    /* 日历表格 */
    #calendar table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    #calendar th {
      font-size: 0.75rem;
      color: #888;
      font-weight: 500;
      padding: 6px 0;
    }
    #calendar td {
      padding: 6px 0;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }
    #calendar td:hover {
      background: #f0f0f0;
    }
    /* 今天日期高亮 */
    #calendar td.today {
      background: #667eea;
      color: #fff;
      font-weight: 600;
    }
    /* 选中日期高亮 */
    #calendar td.selected {
      background: #764ba2;
      color: #fff;
    }
    /* 非当月日期（灰色、不可点击） */
    #calendar td.other-month {
      color: #ccc;
      pointer-events: none;
    }
    /* 日历底部提示信息 */
    #cal-info {
      text-align: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #888;
    }

    /* ============================================================
       【模块2：相册 - 样式】
       功能：定义相册网格布局、缩略图样式、大图遮罩层效果
       包括：3列网格、图片悬停放大、全屏遮罩预览
       ============================================================ */
    .album {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      padding: 20px;
    }
    .album img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .album img:hover {
      transform: scale(1.03);
    }
    /* 大图预览遮罩层 */
    .mask {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .mask img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
    }
    /* 关闭按钮 */
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }
  </style>
</head>

<body style="background-color: #c9ffcf">

  <!-- ============================================================
       【模块1：可拖拽日历窗口 - HTML结构】
       功能：提供窗口的DOM结构，包含标题栏（可拖拽）和日历内容区
       ============================================================ -->
  <div id="win">
    <!-- 标题栏 - 按住这里可以拖动整个窗口 -->
    <div id="bar" onmousedown="startDrag(event)">
      <span>✧ 拖动我</span>
      <span style="font-size:0.8rem;opacity:0.8;">📅</span>
    </div>
    <!-- 内容区 - 日历动态渲染到这里 -->
    <div id="content">
      <div id="calendar"></div>
      <div id="cal-info">点击日期可选中</div>
    </div>
  </div>

  <!-- ============================================================
       【模块3：实时时钟 - HTML结构】
       功能：在页面右上角显示当前日期和时间（24小时制）
       ============================================================ -->
  <div id="c" style="position:fixed;top:10px;right:10px;background:#000;color:#fff;padding:8px 16px;border-radius:20px;font:18px monospace;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.3)"></div>

  <!-- ============================================================
       【页面内容区】
       ============================================================ -->
  <h1>Welcome to my OS</h1>
  <h2>Introduction</h2>
  <p>Hello world</p>
  <p>(rest of your content)</p>
  <a href="https://stardance.hackclub.com/amd">label</a>

  <!-- ============================================================
       【模块2：相册 - HTML结构】
       功能：展示6张图片缩略图，点击可放大预览
       ============================================================ -->
  <h1>我的相册</h1>
  <div class="album">
    <img src="1.JPG" onclick="showBig(this.src)">
    <img src="2.JPG" onclick="showBig(this.src)">
    <img src="3.JPG" onclick="showBig(this.src)">
    <img src="4.JPG" onclick="showBig(this.src)">
    <img src="5.JPG" onclick="showBig(this.src)">
    <img src="6.JPG" onclick="showBig(this.src)">
  </div>
  <!-- 大图预览遮罩层 -->
  <div class="mask" id="mask">
    <span class="close" onclick="closeBig()">×</span>
    <img src="" id="bigImg">
  </div>

  <!-- ============================================================
       【JavaScript 脚本区】
       ============================================================ -->
  <script>

    // ============================================================
    // 【模块1a：拖拽逻辑】
    // 功能：实现窗口的鼠标拖拽移动
    // 原理：按下标题栏时记录偏移量，鼠标移动时更新窗口位置
    // ============================================================
    (function() {
      const win = document.getElementById('win');
      let offsetX = 0, offsetY = 0;

      // 开始拖动（暴露给全局供 onmousedown 调用）
      window.startDrag = function(e) {
        e.preventDefault();
        // 计算鼠标相对于窗口左上角的偏移量
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
        // 绑定鼠标移动和松开事件
        document.onmousemove = function(e) {
          e.preventDefault();
          win.style.left = e.clientX - offsetX + 'px';
          win.style.top = e.clientY - offsetY + 'px';
        };
        document.onmouseup = function() {
          document.onmousemove = null;
          document.onmouseup = null;
        };
      };
    })();

    // ============================================================
    // 【模块1b：日历逻辑】
    // 功能：动态生成月历，支持上下月切换、日期选中、今日高亮
    // 原理：根据年月计算当月天数和首日星期，拼接HTML表格渲染
    // ============================================================
    (function() {
      const calDiv = document.getElementById('calendar');
      const infoDiv = document.getElementById('cal-info');
      let currentYear, currentMonth;
      let selectedDate = null; // 保存用户选中的日期

      // 核心：渲染指定年月的日历
      function renderCalendar(year, month) {
        currentYear = year;
        currentMonth = month;

        const firstDay = new Date(year, month, 1).getDay();       // 当月第一天是星期几
        const daysInMonth = new Date(year, month + 1, 0).getDate(); // 当月总天数
        const daysInPrevMonth = new Date(year, month, 0).getDate(); // 上月总天数

        const today = new Date();
        const todayDate = today.getDate();
        const todayMonth = today.getMonth();
        const todayYear = today.getFullYear();

        let html = `
          <div class="cal-header">
            <button onclick="window.calPrev()">‹</button>
            <span>${year}年 ${month + 1}月</span>
            <button onclick="window.calNext()">›</button>
          </div>
          <table>
            <thead><tr>
              <th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th>
            </tr></thead>
            <tbody><tr>
        `;

        // 上月末尾日期填充（灰色）
        for (let i = 0; i < firstDay; i++) {
          const day = daysInPrevMonth - firstDay + i + 1;
          html += `<td class="other-month">${day}</td>`;
        }

        // 当月日期
        for (let d = 1; d <= daysInMonth; d++) {
          const isToday = (d === todayDate && month === todayMonth && year === todayYear);
          const isSelected = selectedDate &&
                            d === selectedDate.getDate() &&
                            month === selectedDate.getMonth() &&
                            year === selectedDate.getFullYear();
          const cls = (isToday ? 'today' : '') + (isSelected ? ' selected' : '');
          html += `<td class="${cls}" onclick="window.calSelect(${year}, ${month}, ${d})">${d}</td>`;
          // 每7个换行
          if ((firstDay + d - 1) % 7 === 6 && d < daysInMonth) {
            html += `</tr><tr>`;
          }
        }

        // 下月开头日期填充（灰色）
        const totalCells = firstDay + daysInMonth;
        const remain = (7 - totalCells % 7) % 7;
        for (let i = 1; i <= remain; i++) {
          html += `<td class="other-month">${i}</td>`;
        }

        html += `</tr></tbody></table>`;
        calDiv.innerHTML = html;

        // 更新底部选中提示
        if (selectedDate) {
          infoDiv.textContent = `已选：${selectedDate.getFullYear()}年${selectedDate.getMonth()+1}月${selectedDate.getDate()}日`;
        } else {
          infoDiv.textContent = '点击日期可选中';
        }
      }

      // 上一月
      window.calPrev = function() {
        if (currentMonth === 0) {
          renderCalendar(currentYear - 1, 11);
        } else {
          renderCalendar(currentYear, currentMonth - 1);
        }
      };

      // 下一月
      window.calNext = function() {
        if (currentMonth === 11) {
          renderCalendar(currentYear + 1, 0);
        } else {
          renderCalendar(currentYear, currentMonth + 1);
        }
      };

      // 选中日期
      window.calSelect = function(year, month, day) {
        selectedDate = new Date(year, month, day);
        renderCalendar(currentYear, currentMonth); // 重新渲染以高亮
      };

      // 初始化：显示当前月份
      const now = new Date();
      renderCalendar(now.getFullYear(), now.getMonth());
    })();

    // ============================================================
    // 【模块2：相册大图预览逻辑】
    // 功能：点击缩略图显示全屏大图，点击关闭按钮或遮罩层关闭
    // ============================================================
    function showBig(src) {
      document.getElementById("bigImg").src = src;
      document.getElementById("mask").style.display = "flex";
    }
    function closeBig() {
      document.getElementById("mask").style.display = "none";
    }

    // ============================================================
    // 【模块3：实时时钟逻辑】
    // 功能：每秒更新一次，显示当前日期和时间（24小时制）
    // ============================================================
    const clockEl = document.getElementById('c');
    clockEl.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
    setInterval(() => {
      clockEl.innerText = new Date().toLocaleString('zh-CN', { hour12: false });
    }, 1000);

  </script>
</body>
</html>
